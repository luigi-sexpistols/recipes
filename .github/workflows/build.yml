name: Build

permissions:
  contents: write

on:
  pull_request:
  push:
    branches: [ "main" ]
    tags: [ "*" ]

jobs:
  build:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        run: HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm build

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: recipes-pdf
          path: recipes.pdf

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('recipes.pdf') != ''
        with:
          files: |
            recipes.pdf
