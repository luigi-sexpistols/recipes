name: Build

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ "main" ]
    tags: [ "*" ]

jobs:
  build:
    name: Build PDF
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build PDF
        run: HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm build

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: recipes-pdf
          path: recipes.pdf
  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF
        uses: actions/download-artifact@v4
        with:
          name: recipes-pdf

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: hashFiles('recipes.pdf') != ''
        with:
          files: |
            recipes.pdf
