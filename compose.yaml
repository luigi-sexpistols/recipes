services:
  build:
    image: texlive/texlive@sha256:c21636aa13e86716d15dab4e352356cb0d34f9365d6091db066e5df71041d67b
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /work
    volumes:
      - .:/work
    environment:
      HOME: /tmp
      TEXINPUTS: "/work/src:"
    command:
      - latexmk
      - -gg
      - -pdf
      - -interaction=nonstopmode
      - -halt-on-error
      - -no-shell-escape
      - -file-line-error
      - src/recipes.tex
